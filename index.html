<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adagrams</title>
</head>
<body>
  <main>
    <h1>Adagrams</h1>

    <section>
      <p>Draw 10 letters to start playing!</p>

      <button id="drawButton">Draw Letters</button>

      <div id="letterBank"></div>
    </section>

    <section>
      <h2>Submit a Word</h2>

      <label for="wordInput">Enter a word:</label>
      <input
        type="text"
        id="wordInput"
        placeholder="Enter a word"
      />

      <button id="submitButton">Submit</button>

      <p id="result"></p>
      <p id="score"></p>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
